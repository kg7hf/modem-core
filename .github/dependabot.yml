#
# The workflow pins each action to a full commit SHA. Dependabot keeps those pins
# current: when a pinned action has a new release it opens a pull request, which
# runs the full CI before anything changes.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
